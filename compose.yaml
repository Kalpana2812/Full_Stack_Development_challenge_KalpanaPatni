services:
  app:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
      - peblo-catalogue-data:/var/lib/peblo
      - local-artwork-data:/var/lib/peblo/artwork
    command: sh -c "corepack enable && pnpm config set store-dir /pnpm/store && pnpm install --frozen-lockfile --prefer-offline && pnpm drizzle-kit migrate && pnpm dev"
    environment:
      DATABASE_URL: mysql://peblo:peblo@db:3306/peblo_tv
      JWT_SECRET: local-development-only-change-me
      OAUTH_SERVER_URL: http://localhost:3000
      VITE_APP_ID: local
      VITE_OAUTH_PORTAL_URL: http://localhost:3000
      OWNER_OPEN_ID: local-admin
      OWNER_NAME: Local Admin
      CATALOGUE_STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /var/lib/peblo
      LOCAL_ARTWORK_STORAGE_PATH: /var/lib/peblo/artwork
      LOCAL_ADMIN_MODE: "true"
      LOCAL_ADMIN_PASSWORD: peblo-local-admin
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: peblo_tv
      MYSQL_USER: peblo
      MYSQL_PASSWORD: peblo
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-password"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peblo_tv_fastapi
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_tv_fastapi"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  fastapi:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    environment:
      FASTAPI_DATABASE_URL: postgresql+asyncpg://peblo:peblo@postgres:5432/peblo_tv_fastapi
      CATALOGUE_STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /var/lib/peblo
      FASTAPI_ADMIN_TOKEN: peblo-local-admin
      FASTAPI_EDITOR_TOKEN: peblo-local-editor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fastapi-data:/var/lib/peblo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  postgres-data:
  fastapi-data:
  peblo-catalogue-data:
  local-artwork-data:
  node-modules:
  pnpm-store:

